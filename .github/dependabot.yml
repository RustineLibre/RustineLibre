# Dependabot configuration.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Two settings are not decorative:
#  - `applies-to: version-updates` on every group. Without it, security updates
#    would be grouped and delayed instead of arriving as immediate, individual
#    PRs — the opposite of the wanted behavior.
#  - `cooldown` only applies to version updates, it never delays security ones.
version: 2
updates:
  - package-ecosystem: composer
    directory: /api
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 7
      semver-major-days: 30
    groups:
      symfony:
        applies-to: version-updates
        patterns: ["symfony/*", "doctrine/*"]
        update-types: ["minor", "patch"]
      dev:
        applies-to: version-updates
        dependency-type: development
        patterns: ["*"]
      prod-minor-patch:
        applies-to: version-updates
        dependency-type: production
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /pwa
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    cooldown: { default-days: 7, semver-major-days: 30 }
    groups:
      npm-dev:
        applies-to: version-updates
        dependency-type: development
        patterns: ["*"]
      npm-prod:
        applies-to: version-updates
        dependency-type: production
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions: { patterns: ["*"] }

  - package-ecosystem: docker
    directory: /api
    schedule: { interval: weekly, day: monday }
    commit-message:
      prefix: "chore(deps)"
    cooldown: { default-days: 7, semver-major-days: 30 }

  - package-ecosystem: docker
    directory: /pwa
    schedule: { interval: weekly, day: monday }
    commit-message:
      prefix: "chore(deps)"
    cooldown: { default-days: 7, semver-major-days: 30 }
