# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "composer" # See documentation for possible values
    directory: "/api" # Location of package manifests
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore" # Prefix for commit messages
    open-pull-requests-limit: 10
    groups:
      symfony:
        patterns:
          - "symfony/*"
    # The API targets the Symfony 6.4 LTS line (see extra.symfony.require in
    # api/composer.json). Without this bound, Dependabot bumps transitive
    # symfony/* packages to 7.x while flex keeps the rest on 6.4, which
    # produces an uninstallable composer.lock. Drop it when migrating to 7.4.
    ignore:
      - dependency-name: "symfony/*"
        versions: [">=7.0"]

  - package-ecosystem: "npm"
    directory: "/pwa"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 10

  - package-ecosystem: "docker"
    directory: "/api"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "docker"
    directory: "/pwa"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"