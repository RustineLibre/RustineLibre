# Sentry is inert as long as SENTRY_DSN is empty (local dev, CI, tests, build).
parameters:
    sentry_traces_sample_rate_default: 0.0

sentry:
    dsn: '%env(default::SENTRY_DSN)%'
    options:
        environment: '%env(default:kernel.environment:SENTRY_ENVIRONMENT)%'
        release: '%env(default::SENTRY_RELEASE)%'
        send_default_pii: false
        traces_sample_rate: '%env(float:default:sentry_traces_sample_rate_default:SENTRY_TRACES_SAMPLE_RATE)%'
        # Drops 4xx (client errors) so that only real server errors are reported
        before_send: 'App\Sentry\ClientErrorFilter'

when@test:
    sentry:
        dsn: ~
